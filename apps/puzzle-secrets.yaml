# Key Vault -> K8s Secret plumbing for the puzzle PostgreSQL credentials.
#
# Wave 2 so the puzzle-postgresql Secret exists before the postgresql chart
# (wave 3) starts and tries to read it via auth.existingSecret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: puzzle-secrets
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # cascade-delete on removal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Franta89/gitops.git
    targetRevision: main
    path: manifests/puzzle
  destination:
    server: https://kubernetes.default.svc
    namespace: puzzle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
