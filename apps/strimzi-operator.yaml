# Installs the Strimzi operator from its Helm chart. Sync wave 0 so the CRDs
# exist before the Kafka cluster (wave 1) is applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # cascade-delete on removal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.51.0   # TODO: confirm latest Strimzi chart version
    helm:
      releaseName: strimzi
      values: |
        watchAnyNamespace: false
        # The chart defaults to 200m CPU, but the operator idles at ~9m on this
        # single-node sandbox — it only does work when a Kafka CR changes. The
        # request is what blocks scheduling, so 200m of reservation for 9m of use
        # priced out other workloads on a 2-vCPU node. Raise for prod.
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
