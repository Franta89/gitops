# PostgreSQL for storing puzzle game events.
# Credentials come from Azure Key Vault via the AKV CSI driver — the
# puzzle-postgresql Secret is materialised by the puzzle-secrets Application
# (wave 2, manifests/puzzle/). Nothing sensitive in this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.38   # TODO: verify latest
    helm:
      releaseName: postgresql
      values: |
        # Bitnami moved free Docker Hub images to the bitnamilegacy/ repo (Aug 2025
        # catalog change); the chart's default bitnami/postgresql:<tag> is no longer
        # pullable (ImagePullBackOff). Redirect to the legacy archive, same tag.
        image:
          repository: bitnamilegacy/postgresql
        auth:
          username: puzzle
          database: puzzle_events
          # The password previously lived here in plaintext and was committed to
          # git. It now comes from Key Vault: the puzzle-secrets Application syncs
          # kv-ddot-dev-swc-002/puzzle-postgres-password into this Secret, which
          # carries both keys the chart expects (postgres-password, password).
          existingSecret: puzzle-postgresql
        primary:
          persistence:
            size: 1Gi
          # The puzzle DB idles at ~8m CPU; 50m was reserved but unused.
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: puzzle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
