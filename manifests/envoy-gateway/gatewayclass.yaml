# GatewayClass + proxy tuning for Envoy Gateway (replaces azure-alb-external).
#
# Gateways reference `eg` instead of `azure-alb-external`; the HTTPRoutes that
# attach to them need no change at all, being plain Gateway API.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: ddot-proxy
    namespace: envoy-gateway-system
---
# Data-plane settings for every Gateway using the `eg` class. Envoy Gateway
# provisions one Envoy Deployment + Service per Gateway from this template.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ddot-proxy
  namespace: envoy-gateway-system
spec:
  # One worker thread. Envoy defaults to one per vCPU, which on this 2-vCPU node
  # would reserve more than this traffic level ever needs.
  concurrency: 1
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        # ORIGIN LOCK. All public traffic is proxied through Cloudflare, so only
        # Cloudflare edge IPs have any business reaching this Service. AKS turns
        # loadBalancerSourceRanges into NSG rules automatically, which closes the
        # "attacker finds the origin IP and bypasses the Cloudflare WAF" gap.
        #
        # This replaces the equivalent rule in the AGC WAF policy, which was
        # configured but never actually programmed (the WAFPolicy CR sat at
        # Deployment=False for 52 days), so the lock was not in force.
        #
        # Source: https://www.cloudflare.com/ips-v4 — keep in sync, and keep
        # identical to cloudflare_ipv4 in infra-terraform.
        loadBalancerSourceRanges:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
