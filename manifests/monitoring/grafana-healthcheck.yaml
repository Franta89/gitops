# RETIRED with AGC (2026-08-07); commented out 2026-09-30.
#
# HealthCheckPolicy is an AGC CRD (alb.networking.azure.io). The old cluster presumably
# kept it installed after the AGC retirement, so this synced as a dead object; a
# fresh cluster has no such CRD, and the object failed the whole Argo sync
# ("one or more synchronization tasks are not valid"). Envoy Gateway needs no
# probe policy: it routes only to Ready endpoints. Uncomment if AGC returns.
#
# # AGC health probe for Grafana. Without this, AGC probes the backend at "/",
# # which Grafana returns 403 for (it serves under /grafana via serve_from_sub_path),
# # so AGC marks the backend unhealthy -> clients get "no healthy upstream".
# # Grafana's /api/health returns 200, so probe that instead.
# apiVersion: alb.networking.azure.io/v1
# kind: HealthCheckPolicy
# metadata:
#   name: grafana-healthcheck
#   namespace: monitoring
# spec:
#   targetRef:
#     group: ""
#     kind: Service
#     name: monitoring-grafana
#   default:
#     interval: 15s
#     timeout: 5s
#     healthyThreshold: 1
#     unhealthyThreshold: 3
#     http:
#       path: /api/health
#       match:
#         statusCodes:
#           - start: 200
#             end: 299
