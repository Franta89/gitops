# Grafana route under Gateway API (replaces the kube-prometheus-stack nginx
# Ingress, which is disabled in apps/monitoring.yaml).
#
# Attaches cross-namespace to ddot-gateway-eg in the news-digest namespace — allowed
# because that Gateway's listeners set allowedRoutes.namespaces.from: All. The
# HTTPS listener's dailydoseoftech-tls cert already covers this host, so Grafana
# keeps working over TLS at https://dailydoseoftech.org/grafana.
#
# Grafana is configured with serve_from_sub_path + root_url=/grafana
# (apps/monitoring.yaml), so the /grafana prefix is preserved (no rewrite needed).
# A /grafana PathPrefix is longer/more specific than the app's "/" route, so
# Gateway API matching precedence sends /grafana here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  # Cross-namespace attach, allowed by allowedRoutes.namespaces.from: All on the
  # Gateway's listeners.
  parentRefs:
    - name: ddot-gateway-eg
      namespace: news-digest
      sectionName: https
  hostnames:
    - dailydoseoftech.org
  rules:
    # Grafana serves its own Prometheus metrics at /metrics without auth. Deny it
    # at the edge (SECURITY.md S4); the longer PathPrefix wins over /grafana.
    # Prometheus scrapes Grafana in-cluster via its ServiceMonitor, unaffected.
    - matches:
        - path:
            type: PathPrefix
            value: /grafana/metrics
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: grafana-deny-404
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: monitoring-grafana
          port: 80
---
# Fixed 404 used by the /grafana/metrics rule above (Envoy Gateway extension).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: grafana-deny-404
  namespace: monitoring
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "Not Found"
