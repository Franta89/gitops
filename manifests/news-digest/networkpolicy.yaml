# Restrict which pods may reach PostgreSQL.
# Only the API deployment and CronJob worker pods are allowed on port 5432.
# All other ingress to postgres is denied by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: news-digest
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: news-api
        - podSelector:
            matchLabels:
              app: news-digest-worker
      ports:
        - protocol: TCP
          port: 5432
---
# NOTE: the frontend has NO NetworkPolicy. It is the app's public web entry point,
# and in-cluster ingress to it is left open: pinning an ipBlock to the ingress
# source proved unreliable under the Cilium dataplane. The sensitive tiers —
# Postgres and the API — remain restricted by the identity-based (podSelector)
# policies here.
#
# The origin lock lives at the edge instead, as loadBalancerSourceRanges on the
# Envoy Service (manifests/envoy-gateway/gatewayclass.yaml), which AKS renders into
# NSG rules restricting the public IP to Cloudflare's ranges. That is a real
# control, unlike the AGC WAF origin-lock this comment used to credit: its
# WAFPolicy CR never programmed (Deployment=False for 52 days), so it was never in
# force. Since Envoy now enters from inside the pod network, a podSelector-based
# policy for the frontend is finally feasible if it is ever wanted.
#
# Allow the frontend pods to reach the API within the namespace. Public traffic
# reaches the API only via the frontend nginx proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: news-digest
spec:
  podSelector:
    matchLabels:
      app: news-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: news-frontend
        # The audio warm-up CronJob calls /api/audio to pre-generate Listen audio.
        - podSelector:
            matchLabels:
              app: news-digest-audio-warm
      ports:
        - protocol: TCP
          port: 8000
