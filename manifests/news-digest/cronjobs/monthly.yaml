# Runs at 06:00 CET/CEST on the 1st of each month. timeZone handles DST.
# Summarises all daily digests from the previous calendar month.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-digest-monthly
  namespace: news-digest
spec:
  schedule: "0 6 1 * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # This job runs once a month, so a failure must stay inspectable until someone
  # looks. restartPolicy: Never keeps the failed pod (and its logs) instead of
  # letting the job controller delete it — an earlier 429 failure was invisible
  # precisely because OnFailure discarded the pod.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: news-digest-worker
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: news-digest-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: aggregator
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              # Non-root (uid 1000): pip --user installs into $HOME/.local.
              args:
                - |
                  pip install --user --quiet \
                    "openai~=1.57.4" \
                    "azure-identity~=1.19.0" \
                    "psycopg2-binary~=2.9.10" \
                    "requests~=2.32.3" &&
                  python /scripts/aggregator.py monthly
              workingDir: /scripts
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: news-digest-settings
                - secretRef:
                    name: postgres-secret
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: aggregator-script
                  mountPath: /scripts/aggregator.py
                  subPath: aggregator.py
                - name: akv-secrets
                  mountPath: /mnt/secrets
                  readOnly: true
          volumes:
            - name: aggregator-script
              configMap:
                name: aggregator-script
            - name: akv-secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: news-digest-akv
