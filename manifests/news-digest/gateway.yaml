# The shared Gateway: terminates TLS and fronts both the ddot app (/) and Grafana
# (/grafana, cross-namespace).
#
# Served by Envoy Gateway in-cluster (GatewayClass `eg`) since 2026-08-07,
# replacing Azure Application Gateway for Containers. AGC cost ~EUR 126/month —
# 52% of the entire subscription — on flat hourly meters that bill identically at
# zero traffic (77% of it the mandatory association, only ~6% usage-driven), so
# there was nothing to tune. See README.md "Retired: Application Gateway for
# Containers" for the cost breakdown and the restore checklist.
#
# NAME: the `-eg` suffix is a leftover from the parallel-run cutover, when this
# Gateway existed alongside the AGC-backed `ddot-gateway`. It is kept because
# renaming forces Envoy Gateway to tear down this Gateway's Deployment/Service and
# re-attach the static IP to a new one — a self-inflicted outage for a cosmetic
# gain. Rename during a maintenance window if it ever bothers you.
#
# The public IP is the static azurerm_public_ip.ingress, claimed by the Envoy
# Service and locked to Cloudflare edge ranges — both in
# manifests/envoy-gateway/gatewayclass.yaml. Read the address with:
#   kubectl get gateway ddot-gateway-eg -n news-digest -o jsonpath='{.status.addresses[0].value}'
#
# TO RESTORE AGC: re-add a Gateway with gatewayClassName azure-alb-external and
# the annotation alb.networking.azure.io/alb-id: <terraform output alb_id>, then
# repoint the Cloudflare records at its runtime FQDN (AGC regenerates the FQDN on
# recreation; it cannot be pinned). Full checklist in README.md.
#
# allowedRoutes.namespaces.from: All lets routes in other namespaces (e.g. the
# Grafana HTTPRoute in `monitoring`) attach to these listeners.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ddot-gateway-eg
  namespace: news-digest
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dailydoseoftech-tls
      allowedRoutes:
        namespaces:
          from: All
