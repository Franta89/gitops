# Azure Disk StorageClass for PostgreSQL.
#
# WHY THIS EXISTS
# IN USE since the 2026-10-01 cutover. The database previously ran on
# `azurefile-postgres` (see storageclass.yaml), which is Azure Files — an SMB share. PostgreSQL is not supported on SMB: its
# durability guarantees depend on POSIX fsync and file-locking semantics that the
# protocol does not reproduce, so the failure mode is silent data corruption
# rather than a clean error. Azure Disk is the correct backing store for a
# single-writer database.
#
# It also fixes two secondary problems in the old class:
#   * reclaimPolicy: Delete    -> Retain. With Argo's `prune: true`, a bad sync
#     that removes the PVC currently destroys the database with no way back and
#     no backup. Retain keeps the underlying disk after PVC deletion.
#   * volumeBindingMode: Immediate -> WaitForFirstConsumer, so the disk is created
#     in the same zone as the pod that will mount it.
#
# CUTOVER PROCEDURE (as run on 2026-10-01; reuse it for any future storage change)
# StorageClasses and StatefulSet volumeClaimTemplates are both immutable, so a
# storage change is a deliberate operator action (a few minutes of API downtime):
#
#   1. Back up with --clean so the restore replaces tables the app re-creates:
#        kubectl exec -n news-digest postgres-0 -c postgres -- #          pg_dump -U newsdigest --clean --if-exists newsdigest > digest.sql
#   2. In postgres/statefulset.yaml change storageClassName AND rename the
#      volumeClaimTemplate (+ both volumeMounts). The new name guarantees a fresh
#      PVC: Argo's self-heal recreates the StatefulSet within seconds and, with the
#      old name, would re-attach the old PVC if it still existed. Push; the
#      StatefulSet sync fails (immutable field) until step 3.
#   3.   kubectl delete statefulset postgres -n news-digest --cascade=orphan
#        kubectl delete pod postgres-0 -n news-digest
#      Argo recreates the StatefulSet with a fresh PVC; wait for postgres-0 Ready.
#   4. Restore:
#        kubectl exec -i -n news-digest postgres-0 -c postgres -- #          psql -U newsdigest newsdigest < digest.sql
#   5. Verify row counts, https://dailydoseoftech.org, and
#        kubectl get pvc -n news-digest   # new PVC bound to managed-postgres
#   6. Only then delete the old PVC (reclaimPolicy Delete removes its share/disk).
#
# Losing the digest history is not catastrophic — the CronJob republishes daily —
# but the dump makes the cutover reversible.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-postgres
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
