# DEPRECATED — see storageclass-managed.yaml.
#
# PostgreSQL on Azure Files (SMB) is unsupported: fsync and file-locking semantics
# differ from POSIX, so corruption can occur silently. reclaimPolicy: Delete also
# means an Argo prune of the PVC destroys the database irrecoverably, and there is
# no backup. Replaced by storageclass-managed.yaml (Azure Disk, Retain) in the
# 2026-10-01 cutover. Unused once the old postgres-data-postgres-0 claim is
# deleted; remove this file after that.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-postgres
provisioner: file.csi.azure.com
parameters:
  skuName: Standard_LRS
mountOptions:
  - uid=70
  - gid=70
  - dir_mode=0750
  - file_mode=0640
  - mfsymlinks
  - cache=strict
  - actimeo=30
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
