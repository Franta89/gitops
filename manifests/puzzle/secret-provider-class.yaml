# Pulls the puzzle PostgreSQL password from Azure Key Vault and materialises it as
# the K8s Secret the bitnami/postgresql chart consumes via auth.existingSecret.
#
# Replaces the password that used to sit in plaintext in apps/postgresql.yaml.
# The chart reads two keys: postgres-password (superuser) and password (the
# `puzzle` user). Both are mapped from the same Key Vault secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: puzzle-akv
  namespace: puzzle
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "0b1d3541-8e6c-4ef9-93a5-6dead470c8f2"
    keyvaultName: "kv-ddot-dev-swc-002"
    tenantId: "eae82d0e-137d-4df8-ab74-34f582042d39"
    objects: |
      array:
        - |
          objectName: puzzle-postgres-password
          objectType: secret
  secretObjects:
    - secretName: puzzle-postgresql
      type: Opaque
      data:
        - objectName: puzzle-postgres-password
          key: postgres-password
        - objectName: puzzle-postgres-password
          key: password
