# ServiceAccount used by the secret-sync Deployment in the puzzle namespace.
# Bound to the secrets-only Managed Identity (Key Vault Secrets User, nothing else)
# — the same identity the monitoring and cert-manager secret-sync pods use.
# Requires the matching federated credential in infra-terraform
# (modules/azure-ai/main.tf: azurerm_federated_identity_credential.puzzle_secret_sync).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: puzzle-secret-sa
  namespace: puzzle
  annotations:
    azure.workload.identity/client-id: "19dcd42a-34cf-4cf2-9cf4-995d1a51abe9"
